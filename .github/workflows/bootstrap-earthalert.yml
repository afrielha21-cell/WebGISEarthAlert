name: Publish EarthAlert WebGIS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earthalert-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets and content
        run: |
          test -f index.html
          test -f assets/logos/big.svg
          test -f assets/logos/inarisk.svg
          test -f assets/tanya-earth.js
          test -f data/history/2025.json
          node --check app.js
          node --check assets/atlas-v27.js
          node --check assets/tanya-earth.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'atlas-v27.js' in s and 'atlas-v27.css' in s
          assert 'assets/logos/inarisk.svg' in s
          assert 'assets/logos/big.svg' in s
          print('Required EarthAlert assets exist.')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
