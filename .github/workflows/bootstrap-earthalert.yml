name: Migrate and publish EarthAlert WebGIS
on:
  push:
    paths:
      - '.github/workflows/bootstrap-earthalert.yml'
      - 'tools/migrate.py'
      - 'assets/atlas-v27.js'
      - 'assets/atlas-v27.css'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: earthalert-bootstrap
  cancel-in-progress: false
jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download the complete existing EarthAlert project
        run: |
          git clone --depth=1 https://github.com/afrielha21-cell/EarthAlert-Indonesia.git /tmp/earthalert-old
          rsync -a --exclude=.git --exclude=.github /tmp/earthalert-old/ ./
      - name: Apply EarthAlert UI changes and assets
        run: python3 tools/migrate.py
      - name: Commit complete migration to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Migrate complete BMKG EarthAlert archive; Atlas Earth, InaRISK/BIG and chat widget"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload complete static WebGIS
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
